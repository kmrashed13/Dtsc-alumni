
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Registration | DTSC Alumni Association</title>

    <link rel="stylesheet" href="css/register.css">

    <style>
        .registration-container {
            max-width: 950px;
            margin: 35px auto;
            padding: 20px;
        }

        .step-title {
            margin-bottom: 25px;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            box-sizing: border-box;
        }

        .form-field select:disabled {
            background: #edf1f6;
            color: #8793a3;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .next-button {
            background: #103568;
            color: white;
            border: 0;
            padding: 13px 28px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        @media(max-width:650px) {
            .registration-container {
                margin: 15px auto;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<main class="registration-container">

<form id="registrationForm">

<section class="form-step active" id="stepPersonal">

    <div class="step-title">
        <span class="step-label">STEP 01 / 05</span>
        <h2>Personal & Contact Information</h2>
        <p>আপনার ব্যক্তিগত ও যোগাযোগের তথ্য সঠিকভাবে প্রদান করুন।</p>
    </div>

    <div class="personal-card">

        <!-- PHOTO -->
        <div class="photo-area">
            <div class="photo-icon">👤</div>
            <label for="memberPhoto">Upload Profile Photo</label>
            <input type="file" id="memberPhoto" name="photo"
                   accept="image/jpeg,image/png">
            <small>JPG / PNG • আপনার ছবি নির্বাচন করুন</small>
        </div>

        <!-- BASIC INFORMATION -->
        <div class="form-section">
            <h3>Basic Information</h3>

            <div class="form-grid">

                <div class="form-field full">
                    <label>Name as per Certificate <span>*</span></label>
                    <input type="text" name="name" required
                           placeholder="Enter your full name in English">
                </div>

                <div class="form-field">
                    <label>Father's Name <span>*</span></label>
                    <input type="text" name="father_name" required>
                </div>

                <div class="form-field">
                    <label>Mother's Name <span>*</span></label>
                    <input type="text" name="mother_name" required>
                </div>

                <div class="form-field">
                    <label>Date of Birth <span>*</span></label>
                    <div class="dob-grid">
                        <select name="birth_day" required>
                            <option value="">Day</option>
                        </select>

                        <select name="birth_month" required>
                            <option value="">Month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>

                        <select name="birth_year" required>
                            <option value="">Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label>Blood Group</label>
                    <select name="blood_group">
                        <option value="">Select Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>O+</option>
                        <option>O-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Contact Number <span>*</span></label>
                    <input type="tel" name="phone" required
                           placeholder="01XXXXXXXXX">
                </div>

                <div class="form-field full">
                    <label>Email Address</label>
                    <input type="email" name="email"
                           placeholder="example@email.com">
                </div>

            </div>
        </div>

        <!-- PRESENT ADDRESS -->
        <div class="form-section">
            <h3>Present Address</h3>

            <div class="form-grid">

                <div class="form-field">
                    <label>Division <span>*</span></label>
                    <select name="present_division" required>
                        <option value="">Select Division</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>District <span>*</span></label>
                    <select name="present_district" required disabled>
                        <option value="">Select District</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Area Type <span>*</span></label>
                    <select name="present_area_type" required>
                        <option value="">Select Area Type</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>City / Municipality / Upazila <span>*</span></label>
                    <input type="text" name="present_local_area" required
                           placeholder="Enter area name">
                </div>

                <div class="form-field">
                    <label>Ward / Union</label>
                    <input type="text" name="present_ward_union">
                </div>

                <div class="form-field">
                    <label>Post Office</label>
                    <input type="text" name="present_post_office">
                </div>

                <div class="form-field full">
                    <label>Full Address</label>
                    <textarea name="present_address"
                              placeholder="House, Road, Area, Village etc."></textarea>
                </div>

            </div>
        </div>

        <!-- SAME ADDRESS -->
        <label class="address-check">
            <input type="checkbox" id="sameAddress">
            <span>Permanent Address same as Present Address</span>
        </label>

        <!-- PERMANENT ADDRESS -->
        <div class="form-section" id="permanentAddressSection">
            <h3>Permanent Address</h3>

            <div class="form-grid">

                <div class="form-field">
                    <label>Division</label>
                    <select name="permanent_division">
                        <option value="">Select Division</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>District</label>
                    <select name="permanent_district" disabled>
                        <option value="">Select District</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Area Type</label>
                    <select name="permanent_area_type">
                        <option value="">Select Area Type</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>City / Municipality / Upazila</label>
                    <input type="text" name="permanent_local_area">
                </div>

                <div class="form-field">
                    <label>Ward / Union</label>
                    <input type="text" name="permanent_ward_union">
                </div>

                <div class="form-field">
                    <label>Post Office</label>
                    <input type="text" name="permanent_post_office">
                </div>

                <div class="form-field full">
                    <label>Full Address</label>
                    <textarea name="permanent_address"></textarea>
                </div>

            </div>
        </div>

    </div>

    <div class="form-actions">
        <button type="button" class="next-button" id="nextBtn">
            Next Step →
        </button>
    </div>

</section>

</form>
</main>

<!-- ADDRESS DATA -->
<script src="js/bangladesh-address.js"></script>

<!-- DATE OF BIRTH -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const day = document.querySelector('[name="birth_day"]');
    const year = document.querySelector('[name="birth_year"]');

    if (day) {
        for (let i = 1; i <= 31; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = i;
            day.appendChild(option);
        }
    }

    if (year) {
        const currentYear = new Date().getFullYear();

        for (let i = currentYear; i >= 1940; i--) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = i;
            year.appendChild(option);
        }
    }

});
</script>

<script src="js/main.js"></script>
<script src="js/registration.js"></script>

</body>
</html>
